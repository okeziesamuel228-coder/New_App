<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cool Liquidity Vault - v2 (Redesign)</title>
    <script src="https://unpkg.com/@stacks/connect@latest/dist/connect.umd.js"></script>
    <script src="https://unpkg.com/@stacks/transactions@latest/dist/transactions.umd.js"></script>
    <script src="https://unpkg.com/@stacks/network@latest/dist/network.umd.js"></script>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <header>
      <h1>Cool Liquidity Vault <small>v2</small></h1>
      <div id="auth">
        <button id="connect">Connect</button>
        <span id="addr"></span>
      </div>
    </header>

    <section class="grid">
      <div>
        <h3>Config</h3>
        <label>Deployer <input id="deployer" placeholder="ST..." /></label>
        <label>API <input id="api" value="http://127.0.0.1:3999" /></label>
        <button id="refresh">Refresh Pool</button>
      </div>
      <div>
        <h3>Pool</h3>
        <div id="pool">reserves: -, shares: -</div>
        <small id="hint">Enter dx to compute required dy</small>
      </div>
    </section>

    <section>
      <h3>Deposit</h3>
      <div class="row">
        <label>dx (token-a) <input id="dx" type="number" /></label>
        <label>dy (token-b) <input id="dy" type="number" /></label>
        <label>Recipient (optional) <input id="rcpt" placeholder="ST... (blank = self)"/></label>
      </div>
      <div class="row">
        <button id="calc">Suggest dy</button>
        <button id="init">Deposit Initial</button>
        <button id="deposit">Deposit Balanced</button>
        <button id="depositFor">Deposit For</button>
      </div>
      <div class="note" id="note"></div>
    </section>

    <section>
      <h3>Withdraw</h3>
      <label>Burn shares <input id="burn" type="number" /></label>
      <button id="withdraw">Withdraw</button>
    </section>

    <pre id="log"></pre>

    <script src="./app.js"></script>
  </body>
</html>
